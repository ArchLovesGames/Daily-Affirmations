image: python:3.11-slim

stages:
  - validate

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt
  - pip install ruff==0.8.4

lint:
  stage: validate
  script:
    - ruff check .
    - ruff format --check .

compile:
  stage: validate
  script:
    - python -m py_compile app.py
