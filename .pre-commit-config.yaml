repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: local-checks
        name: local project checks
        entry: python scripts/local_checks.py --stage pre-commit
        language: system
        pass_filenames: false
